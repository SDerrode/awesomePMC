# ----------------------------------------------------------------------------
# GitLab CI for awesomePMC
#
# Stages:
#   lint  — ruff (no autofix; fails on any warning).
#   test  — smoke-install (build sdist + wheel, twine check, install the wheel,
#           imports + pmc --help), pytest + coverage on Python 3.11 / 3.12 /
#           3.13 / 3.14, and min-versions (Python 3.11 with the lowest declared
#           runtime dependencies, fast test subset). The jobs are independent
#           signals (packaging vs code vs dependency bounds), so one failing
#           does not block the others — mirrors the GitHub CI.
#
# The "gui" optional extra (PyQt6) is installed so the test_gui_dialogs
# tests run; the system Qt libs needed for headless Qt are pulled in by
# apt before pip install.
# Publication to PyPI is done from GitHub only (.github/workflows/publish.yml,
# see RELEASING.md).
# ----------------------------------------------------------------------------

stages:
  - lint
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

cache:
  key: pip-$CI_JOB_NAME
  paths:
    - .pip-cache/

# ---------------------------------------------------------------------------
# Lint
# ---------------------------------------------------------------------------
lint:
  stage: lint
  image: python:3.12-slim
  before_script:
    - pip install ruff
  script:
    - ruff check pmcprg

# ---------------------------------------------------------------------------
# Smoke — packaging and the *non-editable* install path (audit P-6).
# The test jobs install ``-e ".[dev,gui]"`` (source always on sys.path), so
# they cannot catch a runtime dependency missing from
# ``[project].dependencies``, a broken entry point, or sdist/wheel packaging
# gaps. This builds the distributions as publish.yml does (the wheel is built
# *from the sdist*), runs ``twine check``, installs the wheel with no extras
# and checks the package imports and the ``pmc`` console script runs.
# ---------------------------------------------------------------------------
smoke-install:
  stage: test
  image: python:3.12-slim
  before_script:
    - python -V
    - pip install --upgrade pip
    - pip install build twine
  script:
    - python -m build
    - twine check --strict dist/*
    - tar tzf dist/*.tar.gz | cut -d/ -f2 | sort -u
    - pip install dist/*.whl
    - cd /tmp   # resolve ``pmcprg`` from the install, not the project cwd
    - python -c "import pmcprg, pmcprg.copulas, pmcprg.pmc, pmcprg.missing, pmcprg.diagnostics; print('import OK', pmcprg.__version__)"
    - pmc --help

# ---------------------------------------------------------------------------
# Tests — matrix over Python versions
# 3.11 is the minimum (requires-python); 3.14 is the development version.
# Every job is required (no allow_failure).
# ---------------------------------------------------------------------------
.test-template: &test-template
  stage: test
  before_script:
    - python -V
    - pip install --upgrade pip
    # Headless Qt runtime (PyQt6 needs libGL + xkbcommon + a few X libs)
    - apt-get update -qq
    - apt-get install -qq -y --no-install-recommends
        libgl1 libxkbcommon-x11-0 libdbus-1-3 libegl1
        libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0
        libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
        libxkbcommon0 libfontconfig1
    - pip install -e ".[dev,gui]"
  script:
    - pytest -q --cov --cov-report=term --cov-report=xml
  coverage: '/^TOTAL\s+\d+\s+\d+\s+(\d+)%/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
    expire_in: 1 week

test:python3.11:
  <<: *test-template
  image: python:3.11-slim

test:python3.12:
  <<: *test-template
  image: python:3.12-slim

test:python3.13:
  <<: *test-template
  image: python:3.13-slim

test:python3.14:
  <<: *test-template
  image: python:3.14-slim

# ---------------------------------------------------------------------------
# Minimum versions — are the declared lower bounds true?
# Python 3.11 (the requires-python minimum) with every runtime dependency of
# [project].dependencies, plus the ``ml`` extra (scikit-learn, used by the
# k-means initialisation tests), pinned to its lower bound ("numpy>=1.24" ->
# "numpy==1.24") through a constraints file generated from pyproject.toml,
# then the fast test subset (-m "not slow"). The tests that need PyQt6 /
# nbformat skip themselves.
# A failure here means a lower bound in pyproject.toml (and requirements.txt)
# is false: raise it to the first version that passes (or stop using the newer
# API) — do not silence the job.
# ---------------------------------------------------------------------------
min-versions:
  stage: test
  image: python:3.11-slim
  variables:
    MPLBACKEND: Agg
  before_script:
    - python -V
    - pip install --upgrade pip
    - |
      python - <<'EOF'
      import re, sys, tomllib
      project = tomllib.load(open("pyproject.toml", "rb"))["project"]
      deps = project["dependencies"] + project["optional-dependencies"]["ml"]
      pins = []
      for req in deps:
          m = re.fullmatch(r"\s*([A-Za-z0-9._-]+)\s*>=\s*([0-9][^,;\s]*)\s*", req)
          if m is None:
              sys.exit(f"cannot derive a lower bound from {req!r} (expected 'name>=X.Y')")
          pins.append(f"{m[1]}=={m[2]}")
      open("constraints-min.txt", "w").write("\n".join(pins) + "\n")
      EOF
    - cat constraints-min.txt
    - pip install -c constraints-min.txt ".[ml]" pytest
    - pip list
  script:
    - pytest -q -m "not slow"
