# ----------------------------------------------------------------------------
# GitHub Actions CI for copulasformm  (mirror of .gitlab-ci.yml)
#
# Jobs:
#   lint  — ruff (no autofix; fails on any warning).
#   test  — pytest + coverage on Python 3.11 / 3.12 / 3.13.
#
# The "gui" optional extra (PyQt6) is installed so the test_gui_dialogs
# tests run; PyQt6 ships its own Qt; we just need an X-less display
# server (xvfb) for headless rendering.
# ----------------------------------------------------------------------------

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight runs on the same ref when a new push lands; PR pushes
# of repeated commits don't fan out into queued shadows.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # --------------------------------------------------------------------
  # Lint  — ruff
  # --------------------------------------------------------------------
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff
        run: ruff check prg

  # --------------------------------------------------------------------
  # Tests  — matrix over Python versions
  # --------------------------------------------------------------------
  test:
    name: pytest (Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # ``include``-only matrix so each entry is fully explicit and we
        # can flag 3.13 as experimental (mirroring ``allow_failure: true``
        # in .gitlab-ci.yml). ``continue-on-error`` below picks up the
        # flag.
        include:
          - python-version: "3.11"
            experimental: false
          - python-version: "3.12"
            experimental: false
          - python-version: "3.13"
            experimental: true

    continue-on-error: ${{ matrix.experimental }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Headless Qt runtime — PyQt6 needs libGL + xkbcommon + a few X libs.
      # Qt itself is shipped inside the wheel; we only need the system
      # libraries it dlopens at startup.
      - name: Install system Qt dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y --no-install-recommends \
            libgl1 libxkbcommon-x11-0 libdbus-1-3 libegl1 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libxkbcommon0 libfontconfig1

      - name: Install package
        run: |
          python -V
          pip install --upgrade pip
          pip install -e ".[dev,gui]"

      - name: Run tests with coverage
        env:
          # Headless Qt — avoid "could not connect to any X display".
          QT_QPA_PLATFORM: offscreen
        run: pytest -q --cov --cov-report=term --cov-report=xml

      - name: Upload coverage artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 7
