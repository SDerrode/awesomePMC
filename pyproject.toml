[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "copulasformm"
version = "0.6.0"
description = "Copula-based Markov models for flexible non-Gaussian transition kernels"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"   # tomllib (used by prg.pmc.model) is stdlib since 3.11
authors = [
    { name = "Derrode Stéphane", email = "stephane.derrode@ec-lyon.fr" },
]
keywords = [
    "copula",
    "markov model",
    "hidden markov model",
    "state-space model",
    "dependence modeling",
    "non-gaussian",
    "bayesian filtering",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "statsmodels>=0.14",
    "tomli_w>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
gui = [
    "PyQt6>=6.4",
]

[project.scripts]
pmc = "prg.pmc.cli:main"

[project.urls]
Homepage   = "https://gitlab.ec-lyon.fr/sderrode/copulasformm"
Repository = "https://gitlab.ec-lyon.fr/sderrode/copulasformm"
Mirror     = "https://github.com/SDerrode/copulasformm"

[tool.pytest.ini_options]
testpaths = ["prg/tests"]
python_files = ["test_*.py"]
markers = [
    "slow: marks tests that take > ~1 s (run with `pytest -m slow` to opt in, or `-m 'not slow'` to skip).",
]

[tool.coverage.run]
source = ["prg"]
omit = [
    "prg/tests/*",
    "prg/pmc/gui/*",        # PyQt6 widgets are not unit-tested
    "*/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = false

[tool.ruff.lint]
ignore = ["E402", "E702"]

[tool.hatch.build.targets.wheel]
packages = ["prg"]

[tool.hatch.build.targets.sdist]
include = [
    "prg/",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
exclude = [
    "data/",
    "prg/tests/",
    ".claude/",
]
